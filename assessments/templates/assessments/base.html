<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SecureScan{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<style>
  :root {
    --brand: #2563eb;
    --brand-dark: #1d4ed8;
    --ink: #0f172a;
    --ink-soft: #475569;
    --ink-muted: #94a3b8;
    --line: #e2e8f0;
    --page: #f8fafc;
    --card: #ffffff;
    --danger-bg: #fee2e2; --danger-text: #b91c1c; --danger-border: #fecaca;
    --high-bg: #ffedd5; --high-text: #c2410c; --high-border: #fed7aa;
    --medium-bg: #fef9c3; --medium-text: #a16207; --medium-border: #fef08a;
    --low-bg: #dcfce7; --low-text: #15803d; --low-border: #bbf7d0;
    --info-bg: #f1f5f9; --info-text: #475569; --info-border: #e2e8f0;
  }
  * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  body { background: var(--page); color: var(--ink); }
  a { text-decoration: none; }

  .topnav {
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 0.9rem 0;
  }
  .brand-mark {
    display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; color: var(--ink);
  }
  .brand-icon {
    width: 34px; height: 34px; border-radius: 9px; background: #eff6ff;
    display: flex; align-items: center; justify-content: center; color: var(--brand); font-size: 1.1rem;
  }
  .topnav .nav-link {
    color: var(--ink-soft); font-weight: 500; font-size: 0.92rem; padding: 0.5rem 0.9rem; border-radius: 8px;
  }
  .topnav .nav-link:hover, .topnav .nav-link.active { color: var(--brand); background: #eff6ff; }

  .btn-primary { background: var(--brand); border-color: var(--brand); font-weight: 500; border-radius: 8px; }
  .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
  .btn-outline-primary { color: var(--brand); border-color: var(--line); font-weight: 500; border-radius: 8px; }
  .btn-outline-primary:hover { background: #eff6ff; border-color: var(--brand); color: var(--brand); }
  .btn-outline-secondary, .btn-outline-danger { border-radius: 8px; font-weight: 500; }
  .btn { border-radius: 8px; font-weight: 500; }

  .card { border: 1px solid var(--line); box-shadow: none; border-radius: 14px; background: var(--card); }
  .metric-label { font-size: 0.78rem; color: var(--ink-muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
  .metric-value { font-size: 1.9rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }

  .pill { display: inline-flex; align-items: center; font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid transparent; text-transform: uppercase; letter-spacing: .02em; }
  .pill-critical, .pill-high { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-border); }
  .pill-high { background: var(--high-bg); color: var(--high-text); border-color: var(--high-border); }
  .pill-medium { background: var(--medium-bg); color: var(--medium-text); border-color: var(--medium-border); }
  .pill-low { background: var(--low-bg); color: var(--low-text); border-color: var(--low-border); }
  .pill-info { background: var(--info-bg); color: var(--info-text); border-color: var(--info-border); }

  .table { color: var(--ink); }
  .table thead th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-muted); font-weight: 600; border-bottom: 1px solid var(--line); }
  .table td { border-color: var(--line); vertical-align: middle; font-size: 0.92rem; }
  .table a { color: var(--ink); font-weight: 500; }
  .table a:hover { color: var(--brand); }

  .form-control, .form-select { border-radius: 8px; border-color: var(--line); font-size: 0.92rem; }
  .form-control:focus, .form-select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px #dbeafe; }
  .form-label { font-size: 0.85rem; font-weight: 500; color: var(--ink-soft); }

  .page-title { font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
  .page-subtitle { color: var(--ink-soft); font-size: 0.92rem; }

  .alert-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; border-radius: 10px; }
  .alert-danger { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); border-radius: 10px; }

  .finding-row { border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; background: #fff; }
</style>
</head>
<body>
<nav class="topnav">
  <div class="container">
    <div class="d-flex align-items-center justify-content-between">
      <a class="brand-mark" href="{% url 'scan_dashboard' %}">
        <span class="brand-icon"><i class="ti ti-shield-check"></i></span>
        SecureScan
      </a>
      <div class="d-flex align-items-center">
        <a class="nav-link" href="{% url 'scan_dashboard' %}"><i class="ti ti-radar-2 me-1"></i>Scanner</a>
        <a class="nav-link" href="{% url 'dashboard' %}"><i class="ti ti-clipboard-check me-1"></i>Risk Register</a>
        <a class="nav-link" href="{% url 'asset_list' %}"><i class="ti ti-server-2 me-1"></i>Assets</a>
        <a class="nav-link" href="/admin/"><i class="ti ti-settings me-1"></i>Admin</a>
      </div>
    </div>
  </div>
</nav>
<div class="container py-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} py-2 px-3">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
